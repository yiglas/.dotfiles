set -g default-terminal "screen-256color"

# Reduce escape time to prevent Esc+j/k being interpreted as Alt+j/k
set -sg escape-time 10

# set -g prefix C-a
# unbind C-b
# bind-key C-a send-prefix

unbind %
bind '\' split-window -h

unbind '"'
bind - split-window -v

unbind r
bind r source-file ~/.config/tmux/tmux.conf

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5

bind -r m resize-pane -Z

set -g mouse on
set -g set-clipboard on

set-window-option -g mode-key vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# status bar
bind s set-option -g status
bind C-s set-option -g status
set-option -g status-style default
set -g status-left-length 85
set -g status-left ""
set -g status-right ""
set -g status-justify centre

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
# This checks if the pane is running vim/nvim - if so, send the key to vim
# Otherwise, navigate tmux panes (works for OpenCode and other apps)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
bind-key -n 'C-\' if-shell "$is_vim" 'send-keys C-\\'  'select-pane -l'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l

# tpm plugin
set -g @plugin 'tmux-plugins/tpm'

# list of tmux plugins
# Note: vim-tmux-navigator bindings are defined above manually for immediate use
set -g @plugin 'christoomey/vim-tmux-navigator' # seamless navigation between tmux panes and vim splits
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux session after restart
set -g @plugin 'tmux-plugins/tmux-continuum' # auto save sessions every 15 minutes

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep this line at the very bottom of the tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
